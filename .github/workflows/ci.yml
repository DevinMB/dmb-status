name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write       # the gate merges Dependabot PRs
  pull-requests: write  # ...and labels majors
  packages: write       # push to GHCR on main
  actions: write        # the gate starts the main build after merging
jobs:
  # Shared pipeline: github.com/DevinMB/workflows. Two images, one gate after both.
  api:
    uses: DevinMB/workflows/.github/workflows/app-ci.yml@main
    with:
      image: ghcr.io/devinmb/dmb-status-api
      context: api
      gate: false
  frontend:
    uses: DevinMB/workflows/.github/workflows/app-ci.yml@main
    with:
      image: ghcr.io/devinmb/dmb-status-frontend
      context: frontend
      gate: false
  gate:
    needs: [api, frontend]
    uses: DevinMB/workflows/.github/workflows/dependabot-gate.yml@main
