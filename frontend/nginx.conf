limit_req_zone $binary_remote_addr zone=health_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=health_zone burst=15 nodelay;
        limit_req_status 429;

        # Resolved per request through Docker's DNS, so nginx starts even when
        # the api container is not up yet (or at all, as in CI's smoke test).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
}
